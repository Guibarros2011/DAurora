<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoriaForge</title>
<style>
  :root {
    --sf-bg:          #0a1929;
    --sf-dourado:     #c9954a;
    --sf-azul:        #7ab0d4;
    --sf-texto:       rgba(255,255,255,0.85);
    --sf-muted:       rgba(255,255,255,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--sf-bg);
    min-height: 100vh;
    font-family: -apple-system, sans-serif;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 48px;
    z-index: 100;
    border-bottom: 0.5px solid rgba(255,255,255,0.06);
    background: rgba(10,25,41,0.95);
    backdrop-filter: blur(8px);
  }

  .nav-brand {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.14em;
  }
  .nav-storia { color: var(--sf-dourado); font-style: italic; }
  .nav-sep    { color: var(--sf-muted); }
  .nav-forge  { color: var(--sf-azul); }

  .nav-links { display: flex; gap: 32px; }
  .nav-link  {
    font-size: 11px; letter-spacing: 0.14em;
    color: var(--sf-muted); text-transform: uppercase;
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-link:hover { color: var(--sf-texto); }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 24px 48px;
    position: relative;
    overflow: hidden;
  }

  /* Logo container */
  .logo-hero {
    position: relative;
    width: 460px;
    height: 320px;
    margin-bottom: 0px;
  }

  /* Cérebros — partem juntos do centro */
  .cer {
    position: absolute;
    top: 0;
    height: 200px;
    width: auto;
  }

  .cer-left  {
    right: calc(50% + 3px);
    opacity: 0;
    transform: translateX(60px);
  }
  .cer-right {
    left: calc(50% + 3px);
    opacity: 0;
    transform: translateX(-60px);
  }

  /* Escrito — começa centralizado mas invisível abaixo */
  .escrito {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .escrito img { height: 38px; width: auto; }

  /* Linha divisória central */
  .seam {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    background: linear-gradient(to bottom,
      transparent 0%,
      var(--sf-dourado) 35%,
      var(--sf-azul) 65%,
      transparent 100%);
    transform: translateX(-50%) scaleY(0);
    opacity: 0;
    transform-origin: center;
  }

  /* Tagline */
  .tagline {
    font-size: clamp(16px, 2.5vw, 22px);
    font-style: italic;
    color: var(--sf-texto);
    text-align: center;
    max-width: 560px;
    line-height: 1.6;
    font-family: Georgia, serif;
    opacity: 0;
    transform: translateY(16px);
    margin-bottom: 12px;
  }

  .subtag {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--sf-muted);
    text-transform: uppercase;
    opacity: 0;
    margin-bottom: 40px;
  }

  /* CTAs */
  .ctas {
    display: flex;
    gap: 16px;
    opacity: 0;
    transform: translateY(12px;
  }

  .btn-p {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--sf-dourado); border: 1px solid var(--sf-dourado);
    background: none; padding: 13px 32px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .btn-p:hover { background: var(--sf-dourado); color: var(--sf-bg); }

  .btn-s {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--sf-muted); border: 1px solid rgba(255,255,255,0.15);
    background: none; padding: 13px 32px; cursor: pointer;
    font-family: inherit;
  }

  /* Scroll indicator */
  .scroll-ind {
    position: absolute;
    right: 32px;
    top: 50%;
    writing-mode: vertical-rl;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--sf-muted);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.5s ease 3.5s;
  }

  /* ── ANIMAÇÕES ── */

  /* 1. Cérebros entram do centro para fora */
  .cer-left.play {
    animation: entrarEsq 1.0s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;
  }
  .cer-right.play {
    animation: entrarDir 1.0s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;
  }

  @keyframes entrarEsq {
    from { opacity: 0; transform: translateX(60px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes entrarDir {
    from { opacity: 0; transform: translateX(-60px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* 2. Seam aparece */
  .seam.play {
    animation: revelarSeam 0.5s ease 0.9s forwards;
  }
  @keyframes revelarSeam {
    from { opacity: 0; transform: translateX(-50%) scaleY(0); }
    to   { opacity: 0.45; transform: translateX(-50%) scaleY(1); }
  }

  /* 3. Cérebros se afastam */
  .cer-left.abrir {
    animation: abrirEsq 1.1s cubic-bezier(0.65,0,0.35,1) 1.3s forwards;
  }
  .cer-right.abrir {
    animation: abrirDir 1.1s cubic-bezier(0.65,0,0.35,1) 1.3s forwards;
  }

  @keyframes abrirEsq {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }
  @keyframes abrirDir {
    from { transform: translateX(0); }
    to   { transform: translateX(120px); }
  }

  /* 4. Escrito sobe */
  .escrito.play {
    animation: subirEscrito 0.9s cubic-bezier(0.33,1,0.68,1) 2.1s forwards;
  }
  @keyframes subirEscrito {
    from { bottom: -80px; opacity: 0; }
    to   { bottom: 55px;  opacity: 1; }
  }

  /* 5. Tagline + subtag + CTAs */
  .tagline.play {
    animation: fadeUp 0.7s ease 3.0s forwards;
  }
  .subtag.play {
    animation: fadeUp 0.6s ease 3.2s forwards;
  }
  .ctas.play {
    animation: fadeUp 0.6s ease 3.4s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .scroll-ind.play { opacity: 1; }

  /* Carousel dots */
  .dots {
    display: flex; gap: 8px; margin-top: 32px;
    opacity: 0; transition: opacity 0.5s ease 3.6s;
  }
  .dots.play { opacity: 1; }
  .dot { height: 2px; border-radius: 2px; }
  .dot-a { width: 24px; background: var(--sf-dourado); }
  .dot-b { width: 16px; background: rgba(255,255,255,0.18); }
  .dot-c { width: 16px; background: rgba(255,255,255,0.1); }

  /* Mobile */
  @media (max-width: 600px) {
    nav { padding: 16px 20px; }
    .nav-links { display: none; }
    .logo-hero { width: 320px; height: 240px; }
    .cer { height: 140px; }
    .escrito img { height: 28px; }
    .ctas { flex-direction: column; width: 100%; max-width: 280px; }
    .btn-p, .btn-s { text-align: center; }
  }
</style>
</head>

    <a class="nav-link" href="#">Akvon</a>
    <a class="nav-link" href="#">Forge</a>
    <a class="nav-link" href="#">Contato</a>
  </div>
</nav>

<script>
  function play() {
    // Fase 1 — cérebros entram
    ['cL','cR'].forEach(id => document.getElementById(id).classList.add('play'));
    // Fase 2 — seam aparece
    setTimeout(() => document.getElementById('seam').classList.add('play'), 900);
    // Fase 3 — cérebros abrem
    setTimeout(() => {
      document.getElementById('cL').classList.add('abrir');
      document.getElementById('cR').classList.add('abrir');
    }, 1300);
    // Fase 4 — escrito sobe
    setTimeout(() => document.getElementById('esc').classList.add('play'), 2100);
    // Fase 5 — tagline etc
    ['tag','sub','ctas','dots','scroll-ind'].forEach(id => {
      document.getElementById(id).classList.add('play');
    });
  }

  // Rodar após carregamento
  window.addEventListener('load', () => setTimeout(play, 300));
</script>
